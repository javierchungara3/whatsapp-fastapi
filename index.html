<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Clone Industrial</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #e5ddd5; }
        h2 { color: #075e54; text-align: center; margin-top: 0; }
        #chat { background: white; padding: 15px; height: 350px; overflow-y: scroll; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .msg { background: #dcf8c6; padding: 8px 12px; border-radius: 8px; margin: 5px 0; width: fit-content; max-width: 80%; word-break: break-all; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { padding: 12px 20px; background: #128c7e; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Mi WhatsApp (FastAPI + WebSockets)</h2>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Escribe un mensaje en tiempo real...">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        const ws = new WebSocket("wss://://onrender.com");
        const chatDiv = document.getElementById("chat");

        ws.onmessage = function(event) {
            const messageElement = document.createElement("div");
            messageElement.className = "msg";
            messageElement.textContent = event.data;
            chatDiv.appendChild(messageElement);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        };

        function sendMessage() {
            const input = document.getElementById("messageInput");
            if(input.value.trim() !== "") {
                ws.send(input.value);
                input.value = "";
            }
        }
    </script>
</body>
</html>
